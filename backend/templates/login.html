<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Mayom Holdings</title>
<style>
  :root {
    --bg: #0b1210;
    --panel: #111b18;
    --border: #1f2e28;
    --gold: #c8a252;
    --text: #e8e6df;
    --muted: #8f9d97;
    --error: #d9765c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #10201b 0%, #0b1210 70%);
    font-family: "Georgia", "Times New Roman", serif;
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 40px 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .brand {
    text-align: center;
    margin-bottom: 28px;
  }
  .brand .mark {
    letter-spacing: 3px;
    font-size: 12px;
    color: var(--gold);
    text-transform: uppercase;
  }
  .brand h1 {
    font-size: 20px;
    margin: 8px 0 0;
    font-weight: 400;
    letter-spacing: 1px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 18px 0 6px;
    font-family: Arial, sans-serif;
  }
  input {
    width: 100%;
    padding: 11px 12px;
    background: #0c1512;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 15px;
    font-family: Arial, sans-serif;
  }
  input:focus {
    outline: none;
    border-color: var(--gold);
  }
  button {
    width: 100%;
    margin-top: 26px;
    padding: 12px;
    background: var(--gold);
    color: #111;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    letter-spacing: 0.5px;
    font-family: Arial, sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.9; }
  .error {
    margin-top: 18px;
    padding: 10px 12px;
    background: rgba(217,118,92,0.12);
    border: 1px solid rgba(217,118,92,0.4);
    color: var(--error);
    border-radius: 4px;
    font-size: 13px;
    font-family: Arial, sans-serif;
  }
  .footnote {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    font-family: Arial, sans-serif;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="mark">Juba · South Sudan</div>
      <h1>MAYOM HOLDINGS<br>Admin Console</h1>
    </div>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      <button type="submit">Sign in</button>
    </form>

    <div class="footnote">Authorised personnel only.</div>
  </div>
</body>
</html>
